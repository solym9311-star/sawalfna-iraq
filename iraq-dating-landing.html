<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#171717">
  <title>تعرّف على ناس جديدة 🔥</title>
  <style>
    :root {
      --white: #fff;
      --dark: #111;
      --accent: #ff3b24;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      font-family: Tahoma, Arial, sans-serif;
      color: var(--white);
      background-color: #171717;
      background-image: linear-gradient(rgba(0,0,0,.38), rgba(0,0,0,.62)), url("iraq-landing-background.jpg");
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }
    .page {
      min-height: 100vh;
      min-height: 100svh;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(14px, 3vh, 25px);
      padding: 30px 16px;
      text-align: center;
    }
    .box {
      width: min(100%, 540px);
      padding: 13px 15px;
      background: rgba(12, 12, 12, .68);
      border: 2px solid rgba(255,255,255,.96);
      outline: 1px solid rgba(255,255,255,.6);
      outline-offset: 4px;
      border-radius: 3px;
      box-shadow: 0 5px 22px rgba(0,0,0,.22);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
    }
    .title {
      margin: 0;
      font-size: clamp(25px, 6vw, 38px);
      font-weight: 800;
      line-height: 1.45;
    }
    .subtitle {
      margin: 0;
      font-size: clamp(20px, 5vw, 29px);
      font-weight: 700;
      line-height: 1.6;
    }
    .fire { font-size: clamp(27px, 7vw, 39px); margin-bottom: 7px; }
    .cta {
      margin: 0;
      font-size: clamp(18px, 4.7vw, 25px);
      font-weight: 700;
      line-height: 1.7;
    }
    .more-box {
      padding: 0;
      border: 0;
      outline: 0;
      background: transparent;
      box-shadow: none;
      backdrop-filter: none;
    }
    .more-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 58px;
      padding: 14px 22px;
      border-radius: 12px;
      color: #fff;
      background: linear-gradient(135deg, #ff512f, #dd1717);
      border: 2px solid rgba(255,255,255,.95);
      box-shadow: 0 7px 0 #8c100c, 0 12px 25px rgba(0,0,0,.35);
      text-decoration: none;
      font-size: clamp(20px, 5vw, 27px);
      font-weight: 800;
      transition: transform .18s ease, filter .18s ease;
      animation: pulse 1.8s infinite;
    }
    .more-button:hover { filter: brightness(1.12); transform: translateY(-2px); }
    .more-button:active { transform: translateY(3px); box-shadow: 0 3px 0 #8c100c; }
    .note { margin: 0; font-size: 12px; color: rgba(255,255,255,.88); text-shadow: 0 1px 3px #000; }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 7px 0 #8c100c, 0 12px 25px rgba(0,0,0,.35), 0 0 0 0 rgba(255,59,36,.38); }
      50% { box-shadow: 0 7px 0 #8c100c, 0 12px 25px rgba(0,0,0,.35), 0 0 0 9px rgba(255,59,36,0); }
    }
    @media (max-width: 480px) {
      body { background-attachment: scroll; background-position: center center; }
      .page { justify-content: center; gap: 19px; padding: 28px 18px; }
      .box { padding: 11px 12px; }
      .more-box { padding: 0; }
    }
    @media (prefers-reduced-motion: reduce) { .more-button { animation: none; transition: none; } }
  </style>
</head>
<body>
  <main class="page">
    <section class="box">
      <p class="title">تريد تستأنس وتتونس؟</p>
    </section>

    <section class="box">
      <p class="subtitle">وتروّق ويا ناس حلوة؟ 😉🫦</p>
    </section>

    <section class="box">
      <div class="fire" aria-hidden="true">🔥 🔥 🔥</div>
      <p class="subtitle">عروض حلوة وحماس غير شكل! تعرّف على ناس جديدة 😉</p>
    </section>

    <section class="box">
      <p class="cta">اضغط على «تعرّف على المزيد» وسجّل رقم موبايلك حتى تنضم للكروب 📱</p>
    </section>

    <section class="box">
      <p class="cta">🔥 يلا، ننتظرك ويانا!</p>
    </section>

    <section class="more-box">
      <a class="more-button" href="https://adsone.leadseagle.shop/?utm_medium=ad91ef12cbc61028dd54bd1f95ec531c80b2da20&amp;utm_campaign=medoads1" rel="nofollow">تعرّف على المزيد 🔥</a>
    </section>
    <p class="note">للبالغين فقط • يرجى الالتزام بقواعد المجتمع</p>
  </main>
</body>
</html>
